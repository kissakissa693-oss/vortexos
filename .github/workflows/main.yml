name: Build VortexOS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ISO in Arch container
        run: |
          sudo docker run --privileged --rm \
            -v "${{ github.workspace }}:/profile" \
            archlinux:latest \
            bash -c "pacman -Sy --noconfirm archiso && mkarchiso -v -w /tmp/vortex-work -o /profile/out /profile"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: VortexOS-ISO
          path: out/*.iso
          retention-days: 7
